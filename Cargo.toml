[package]
name = "agentrun"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = "0.4.4"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "macros"] }
unicode-width = "0.2.2"

[[test]]
name = "signals"
harness = false

[[test]]
name = "rich"
harness = false
