[package]
name = "agentrun"
version = "1.0.0"
edition = "2024"
description = "Run claude-code, codex and pi in a sandbox with one command, on macOS, Linux, cloud containers and docker."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yhnocoder/agentrun"
homepage = "https://yhnocoder.github.io/agentrun/"
readme = "README.md"
keywords = ["claude-code", "codex", "sandbox", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = "0.4.4"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "macros"] }
unicode-width = "0.2.2"

[profile.release]
strip = true
lto = true
codegen-units = 1

[[test]]
name = "signals"
harness = false

[[test]]
name = "rich"
harness = false

[[test]]
name = "concurrency"
harness = false
